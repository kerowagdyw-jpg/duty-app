<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">
<title>توزيع أيام العمل بالأقدمية</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#d9dee5;--ac:#0f766e;--acx:#fff;--off:#e9ecf0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2328;--tx:#eceff3;--mu:#98a2b3;--bd:#323941;--ac:#2dd4bf;--acx:#06201d;--off:#262c33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2328;--tx:#eceff3;--mu:#98a2b3;--bd:#323941;--ac:#2dd4bf;--acx:#06201d;--off:#262c33;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;box-sizing:border-box;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px}
textarea{min-height:130px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row label.chk{display:flex;align-items:center;gap:5px;color:var(--tx);margin:0}
.row label.chk input{width:auto}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);cursor:pointer}
button.sec{background:var(--off);color:var(--tx)}
button:disabled{opacity:.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.turn{font-size:17px;font-weight:600;padding:12px;border-radius:12px;color:#fff;margin-bottom:10px}
.sub{font-size:13px;opacity:.9;font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hd{font-size:11px;text-align:center;color:var(--mu)}
.d{min-height:52px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:2px;cursor:pointer;color:var(--tx)}
.d small{font-size:10px;overflow:hidden;white-space:nowrap;max-width:100%;text-overflow:ellipsis}
.d.off{background:var(--off);color:var(--mu);cursor:default;border-style:dashed}
.d.taken{color:#fff;border:0;cursor:default}
.d.empty{border:0;background:none;cursor:default}
.d.sel{outline:3px solid var(--tx);outline-offset:1px}
.pl{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
.pl:last-child{border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.note{font-size:13px;color:var(--mu)}
.scroll{overflow-x:auto}
@media print{.noprint{display:none}}
</style>
</head>
<body>
<main>
<h1>📅 توزيع أيام العمل بالأقدمية</h1>
<div id="app"></div>
<p class="note noprint" style="text-align:center;margin-top:18px">الإصدار 3 · 25-11-2026 · الاسم الأول في التقويم</p>
</main>
<script>
var AR=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var KEY='duty-picker-v1';
var now=new Date();
var S={started:false,ym:now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),names:'معيد 1\nمعيد 2\nمعيد 3\nمعيد 4\nمعيد 5\nمعيد 6\nمعيد 7',wd:[0,1,2,3,4,6],hol:'',mode:'block',picks:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.names)S=o;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fn(n){var w=String(n).trim().split(/\s+/);if(w.length>1&&/^(عبد|ابو|أبو|أبي|ام|أم)$/.test(w[0]))return w[0]+' '+w[1];return w[0]||'';}
function names(){return S.names.split('\n').map(function(x){return x.trim();}).filter(Boolean);}
function col(i){return 'hsl('+(i*47%360)+',55%,38%)';}
var FIX={'01-07':'عيد الميلاد المجيد','01-25':'عيد الشرطة وثورة 25 يناير','04-25':'عيد تحرير سيناء','05-01':'عيد العمال','06-30':'ثورة 30 يونيو','07-23':'ثورة 23 يوليو','10-06':'عيد القوات المسلحة'};
var VAR={'2027-03-10':'عيد الفطر (متوقع، عدّل الأيام الباقية يدوي)','2027-05-03':'شم النسيم','2027-05-15':'وقفة عرفات (متوقع)','2027-05-16':'عيد الأضحى (متوقع)','2027-05-17':'عيد الأضحى (متوقع)','2027-05-18':'عيد الأضحى (متوقع)','2027-05-19':'عيد الأضحى (متوقع)','2027-06-06':'رأس السنة الهجرية (متوقع 6 أو 7)','2027-08-14':'المولد النبوي (متوقع 14 أو 15)'};
function autoHol(){var p=S.ym.split('-'),o={};for(var d=1;d<=31;d++){var dd=(d<10?'0':'')+d,f=FIX[p[1]+'-'+dd],v=VAR[p[0]+'-'+p[1]+'-'+dd];if(f||v)o[d]=f||v;}return o;}
function days(){
  var p=S.ym.split('-'),y=+p[0],m=+p[1]-1,hol={},ah=autoHol(),offH=S.offHol||[];
  Object.keys(ah).forEach(function(k){if(offH.indexOf(S.ym+'-'+k)<0)hol[+k]=1;});
  S.hol.split(/[,،\s]+/).forEach(function(x){if(x)hol[+x]=1;});
  var out=[],n=new Date(y,m+1,0).getDate();
  for(var d=1;d<=n;d++){var w=new Date(y,m,d).getDay(),ov=(S.ov||{})[S.ym+'-'+d];if(ov==='on'||(ov!=='off'&&S.wd.indexOf(w)>-1&&!hol[d]))out.push(d);}
  return out;
}
function targets(){
  var n=names().length,N=days().length,tg=S.tg||{},fixed=0,free=[],t=[],p;
  for(p=0;p<n;p++){if(tg[p]!==undefined&&tg[p]!==null){t[p]=+tg[p];fixed+=t[p];}else free.push(p);}
  var rem=Math.max(0,N-fixed),f=free.length,q=f?Math.floor(rem/f):0,e=f?rem%f:0;
  free.forEach(function(p,k){t[p]=q+(k>=f-e?1:0);});
  return t;
}
function seq(){
  var n=names().length,q=Math.floor(days().length/n),t=targets(),s=[],p,r;
  var b=t.map(function(x){return Math.min(x,q);});
  if(S.mode==='block'){for(p=0;p<n;p++)for(r=0;r<t[p];r++)s.push(p);}
  else{for(r=0;r<q;r++)for(p=0;p<n;p++)if(r<b[p])s.push(p);
    for(p=0;p<n;p++)for(r=q;r<t[p];r++)s.push(p);}
  return s;
}
function curTurn(){
  var s=seq(),c={},i;
  S.picks.forEach(function(k){c[k.p]=(c[k.p]||0)+1;});
  for(i=0;i<s.length;i++){if(c[s[i]]>0)c[s[i]]--;else return {p:s[i],i:i};}
  return null;
}
function adj(i,dl){
  var t=targets(),v=t[i]+dl;if(v<0)return;
  var mine=S.picks.filter(function(k){return k.p===i;}).length;
  if(v<mine&&!confirm('عدد أيامه المختارة أكبر من الحصة الجديدة. تكمل؟'))return;
  S.tg=S.tg||{};S.tg[i]=v;save();render();
}
var SM=false,SF=null;
function swapPick(d){
  var o=owner(d),nm=names();
  if(SF===null){if(o<0){alert('اختار الأول يوم متاخد (اليوم اللي المعيد هيتخلى عنه)');return;}SF=d;render();return;}
  if(SF===d){SF=null;render();return;}
  var a=owner(SF);
  if(o>-1){
    if(o===a){SF=d;render();return;}
    if(!confirm('تبديل: يوم '+SF+' ('+nm[a]+') ⇄ يوم '+d+' ('+nm[o]+') ؟'))return;
    S.picks.forEach(function(k){if(k.d===SF)k.d=d;else if(k.d===d)k.d=SF;});
  }else{
    if(!confirm('نقل يوم '+SF+' للمعيد '+nm[a]+' إلى يوم '+d+' ؟'))return;
    S.picks.forEach(function(k){if(k.d===SF)k.d=d;});
  }
  SF=null;save();render();
}
function setF(k,v){S[k]=v;save();}
function toggleWd(i,on){var a=S.wd.filter(function(x){return x!==i;});if(on)a.push(i);S.wd=a;save();}
function toggleHol(d,on){var k=S.ym+'-'+d,a=(S.offHol||[]).filter(function(x){return x!==k;});if(!on)a.push(k);S.offHol=a;save();}
var EM=false;
function togDay(d){
  var k=S.ym+'-'+d,ov=S.ov||(S.ov={});
  if(days().indexOf(d)>-1){
    if(owner(d)>-1){if(!confirm('اليوم ده متاخد. لو خليته إجازة هيتلغي اختيار المعيد. تكمل؟'))return;S.picks=S.picks.filter(function(x){return x.d!==d;});}
    ov[k]='off';
  }else ov[k]='on';
  save();render();
}
function start(){
  var n=names().length;
  if(n<2){alert('اكتب أسماء المعيدين (كل اسم في سطر)');return;}
  if(days().length<n){alert('عدد أيام العمل أقل من عدد المعيدين');return;}
  S.picks=[];S.tg={};S.started=true;save();render();
}
function pick(d){var t=curTurn();if(!t)return;S.picks.push({d:d,p:t.p});save();render();}
function undo(){S.picks.pop();save();render();}
function back(){if(S.picks.length&&!confirm('الرجوع للإعدادات هيمسح الاختيارات. متأكد؟'))return;S.started=false;S.picks=[];save();render();}
function owner(d){for(var i=0;i<S.picks.length;i++)if(S.picks[i].d===d)return S.picks[i].p;return -1;}
function summary(){
  var nm=names(),r=nm.map(function(){return [];});
  S.picks.forEach(function(k){r[k.p].push(k.d);});
  return r.map(function(a,i){a.sort(function(x,y){return x-y;});return nm[i]+' ('+a.length+'): '+a.join('، ');}).join('\n');
}
function copyRes(){
  var t='جدول أيام العمل — '+MON[+S.ym.split('-')[1]-1]+' '+S.ym.split('-')[0]+'\n'+summary();
  try{navigator.clipboard.writeText(t).then(function(){alert('تم النسخ');},function(){prompt('انسخ النص:',t);});}catch(e){prompt('انسخ النص:',t);}
}
function mkpdf(jpg,w,h){
  var NL=String.fromCharCode(10),enc=new TextEncoder(),parts=[],off=[],len=0,pw=595,ph=842;

function crc32(u){var t=crc32.t,c,n,k,i;if(!t){t=crc32.t=[];for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}}c=0xFFFFFFFF;for(i=0;i<u.length;i++)c=t[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}

    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,f.d.length,true);c.setUint32(24,f.d.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);

async function saveBlob(blob,name){
  var dl=null;try{dl=await claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});}catch(e){alert('ما اتحفظش الملف');}return;}

  for(k=0;k<off;k++)h+='<div class="d empty"></div>';
  for(var d=1;d<=n;d++){
    var o=owner(d);
    if(SM){var w0=ds.indexOf(d)>=0;
      if(!w0)h+='<div class="d off">'+d+'</div>';
      else h+='<button class="d'+(o>-1?' taken':'')+(SF===d?' sel':'')+'"'+(o>-1?' style="background:'+col(o)+'"':'')+' onclick="swapPick('+d+')">'+d+(o>-1?'<small>'+esc(fn(nm[o]))+'</small>':'')+'</button>';
      continue;}
    if(EM){var off0=ds.indexOf(d)<0;h+='<button class="d'+(off0?' off':(o>-1?' taken':''))+'"'+(o>-1&&!off0?' style="background:'+col(o)+'"':'')+' onclick="togDay('+d+')">'+d+(off0?'<small>إجازة</small>':(o>-1?'<small>'+esc(fn(nm[o]))+'</small>':''))+'</button>';continue;}
    if(ds.indexOf(d)<0)h+='<div class="d off" title="'+esc(ah[d]||'')+'">'+d+((ah[d]&&offH.indexOf(S.ym+'-'+d)<0||(S.ov||{})[S.ym+'-'+d]==='off')?'<small>إجازة</small>':'')+'</div>';
    else if(o>-1)h+='<div class="d taken" style="background:'+col(o)+'">'+d+'<small>'+esc(fn(nm[o]))+'</small></div>';
    else if(done)h+='<div class="d">'+d+'</div>';
    else h+='<button class="d" onclick="pick('+d+')">'+d+'</button>';
  }
  h+='</div></div></div><div class="card noprint"><div class="bar" style="margin:0"><button class="sec" onclick="undo()" '+(S.picks.length?'':'disabled')+'>↩️ تراجع عن آخر اختيار</button><button class="sec" onclick="SM=!SM;EM=false;SF=null;render()">'+(SM?'✔️ إنهاء التبديل (اختار يوم متاخد ثم يوم تاني)':'🔄 تبديل أيام')+'</button><button class="sec" onclick="EM=!EM;SM=false;SF=null;render()">'+(EM?'✔️ إنهاء التعديل (اضغط على اليوم لتغييره)':'🗓️ تعديل الإجازات')+'</button><button class="sec" onclick="back()">⚙️ الإعدادات</button></div></div>';
  h+='<div class="card"><b>أيام كل معيد (بترتيب الأقدمية)</b>'+(tsum!==ds.length?'<p class="note">⚠️ مجموع الحصص '+tsum+' ومش بيساوي عدد أيام العمل '+ds.length+'</p>':'');
  var r=nm.map(function(){return [];});S.picks.forEach(function(x){r[x.p].push(x.d);});
  nm.forEach(function(x,i){
    var a=r[i].sort(function(u,v){return u-v;}),tot=s.filter(function(z){return z===i;}).length;
    h+='<div class="pl"><span><span class="dot" style="background:'+col(i)+'"></span>'+(i+1)+'. '+esc(x)+(i===cur?' ◀':'')+'</span><span>'+(a.join('، ')||'—')+' <span class="note">('+a.length+'/'+tot+')</span> <span class="noprint"><button class="sec" style="padding:2px 9px" onclick="adj('+i+',-1)">−</button> <button class="sec" style="padding:2px 9px" onclick="adj('+i+',1)">+</button></span></span></div>';
  });
  h+='<div class="bar noprint"><button onclick="copyRes()">نسخ الجدول</button><button class="sec" onclick="S.tg={};save();render()">⚖️ إعادة التقسيم بالتساوي</button><button class="sec" onclick="pdf()">تحميل PDF</button><button class="sec" onclick="docx()">تحميل Word</button></div></div>';
  A.innerHTML=h;
}
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
